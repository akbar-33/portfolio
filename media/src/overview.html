<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#131418;--ink:#EDEBE5;--red:#FF5A38;--rule:#2B2D34;--muted:#9B9A94;
--serif:"IBM Plex Serif",Georgia,serif;--sans:"IBM Plex Sans",sans-serif;--mono:"IBM Plex Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:var(--paper);color:var(--ink);font-family:var(--sans);
display:flex;flex-direction:column;justify-content:space-between;padding:48px 56px;overflow:hidden}
.nm{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  border-bottom:3px solid var(--ink);padding-bottom:20px}
h1{font-family:var(--serif);font-size:82px;font-weight:600;line-height:1.06;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--red)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row span{font-family:var(--mono);font-size:25px;font-weight:500;color:var(--ink);
  border:2px solid var(--rule);border-radius:3px;padding:9px 16px}
.url{font-family:var(--mono);font-size:34px;font-weight:600;color:var(--red);
  border-top:3px solid var(--ink);padding-top:20px}
</style>
